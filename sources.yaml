# The sources this frontier reconciles.
#
# A Frontier owns its own acquisition inventory. Until this file existed, the
# Physlib commit, tree and eight exact file roots were a frozen constant inside
# the vela-web projection pipeline, which meant the web asserted where this
# Frontier's evidence came from and nothing here could contradict it. The
# Erdős Frontier has declared its own sources since the beginning; this is the
# same file, for this Frontier.
#
# `source_id` is the identifier the release-scoped source registry publishes
# under. It lives here rather than in a mapping table downstream, so adding a
# source is one edit in one repository.
#
# `sources.lock.json` records the exact content hash of each entry below. Every
# hash in it is computed by the generator from bytes it fetched or read; none is
# ever hand-written, because a hash nobody computed is worse than no hash at
# all. The declared Physlib roots below are treated as assertions to check, not
# as values to copy: the generator refetches all eight at the pinned commit and
# fails the run on any mismatch. Regenerate with:
#     python3 scripts/write_sources_lock.py
# The generator is byte-identical across the Frontiers that carry it, so one
# reader consumes every Frontier's lock.

sources:
  physlib:
    source_id: source:physlib
    kind: formal_library
    repo: leanprover-community/physlib
    commit: ad1d812c1cfd269898282081384bd92aef33b278
    tree: c66f558b2dc25bbc85c51123c72b319c1a2ad91b
    url: https://github.com/leanprover-community/physlib
    # Files whose exact roots the acquisition checks on every refresh. A
    # mismatch fails the run rather than retaining different bytes under the
    # same commit. The key is the logical name the acquisition uses; `path` is
    # where it lives in the checkout.
    exact_roots:
      license:
        path: LICENSE
        sha256: sha256:c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4
      lean_toolchain:
        path: lean-toolchain
        sha256: sha256:cc346fd7850a83fb7af3902dfc378f74d8eb8c59c6d34322488269ebfe7615b1
      lakefile:
        path: lakefile.toml
        sha256: sha256:9b6608c26fa30873fb8d823eadd7f66835992389a80c3e44b62e9803c8c65c01
      lake_manifest:
        path: lake-manifest.json
        sha256: sha256:a9531c3978f21e50cb72cc89c2a7644b296bee59a7f2ff92ca2408aac4a67311
      ai_policy:
        path: AI-POLICY.md
        sha256: sha256:a639a2c51091911123600a376c7556b52d92ffd324b041df2e2a66ec7597ed49
      agent_guidance:
        path: AGENTS.md
        sha256: sha256:487a9754f996304b173dd871326a094f4552d27df7151d60c56d83374e7711ca
      api_map_guide:
        path: docs/API_MAP_GUIDE.md
        sha256: sha256:0663b6828ab7635bd69a1bc5913d75c5f1b81640071f43f3db0e5e10f5d29ad1
      review_guidelines:
        path: docs/ReviewGuidelines.md
        sha256: sha256:e28f680f6fc0767840942aaa48da28bd9983cd48db8beec4ab77dafb4dbdab0b

  codetables:
    source_id: source:codetables-stabilizer
    kind: reference_only
    url: https://codetables.de/
    # Reference only. No bytes are retained and no observation is archived; the
    # frontier records that the table was consulted, not what it said. The
    # generator therefore never fetches this url: hashing the page would record
    # a content root for something this frontier does not retain, and a false
    # pin is indistinguishable from a real one once it is in the lock.
    note: >-
      Published stabilizer code parameters are consulted as a reference. They
      confer no Standing, and a match against them is not a Verification.

  quantum_retained_certificate:
    source_id: source:quantum-retained-certificate
    kind: frontier_local_artifact
    path: artifacts/quantum-10-1-4.witness.json
    # In-repo bytes. This entry exists so the registry names the artifact's
    # home rather than treating it as an external acquisition.
