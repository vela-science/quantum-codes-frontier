name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # This job reads the repository and pushes nothing. Full depth is what
          # `vela replay` needs; the token is not, and leaving it in .git/config
          # only gives every later step a credential it has no use for.
          persist-credentials: false
      - name: Reconstruct the retained quantum certificate
        run: |
          python3 scripts/verify_quantum_certificate.py \
            artifacts/quantum-10-1-4.witness.json
          # Discovery names the shape, not one file: a test added to tests/
          # must run without anyone remembering to edit this workflow.
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: vela-science/vela@c4023f111ee88f92e6e3c7b47699499a46e83940 # v0.966.4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
