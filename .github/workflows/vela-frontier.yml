name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Reconstruct the retained quantum certificate
        run: |
          python3 scripts/verify_quantum_certificate.py \
            artifacts/quantum-10-1-4.witness.json
          python3 -m unittest -v tests/test_quantum_certificate.py
      - uses: vela-science/vela@2fafd652c501cfd6be16f24cc13d6e173eccd58a # v0.950.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
          vela-version: v0.950.1
