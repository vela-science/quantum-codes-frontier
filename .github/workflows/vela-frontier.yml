name: Verify current Vela repository

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Reconstruct the retained quantum certificate
        run: |
          python3 scripts/verify_quantum_certificate.py \
            artifacts/quantum-10-1-4.witness.json
          python3 -m unittest discover -s tests -p 'test_quantum_certificate.py' -v
      - uses: vela-science/vela@1418c6ac4f6cc85cb0d7756cf1a96f9a9c0aa6d1 # v0.962.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          frontier: .
